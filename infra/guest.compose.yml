name: renotrace-guest-local
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: renotrace_test
      POSTGRES_USER: renotrace_test
      POSTGRES_PASSWORD: local-test-only
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["guest-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renotrace_test"]
      interval: 2s
      retries: 30
  objects:
    image: chrislusf/seaweedfs:4.53
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: renotrace-local
      AWS_SECRET_ACCESS_KEY: local-object-test-only
    ports: ["127.0.0.1:59000:8333"]
    volumes: ["guest-objects:/data"]
  api:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    ports: ["127.0.0.1:8106:8000"]
    volumes: ["../services/backend/app:/app/services/backend/app:ro"]
    environment:
      DATABASE_URL: postgresql://renotrace_test:local-test-only@postgres:5432/renotrace_test
      S3_ENDPOINT: http://objects:8333
      S3_ACCESS_KEY: renotrace-local
      S3_SECRET_KEY: local-object-test-only
      REVIEW_STORAGE_BUCKET: guest-originals
      FRONTEND_ORIGIN: http://127.0.0.1:3106
      PYTHONPATH: /app/services/backend
    depends_on:
      postgres:
        condition: service_healthy
      objects:
        condition: service_started
volumes:
  guest-db:
  guest-objects:
